<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="ad.size" content="width=320,height=480">
<title>Playable Ad</title>
<style>
:root{--app-w:100vw;--app-h:100vh;--safe-top:48px;--safe-bottom:72px;--safe-side:16px;--base:3.9px;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-drag:none;user-drag:none;}
html,body{width:100%;height:100%;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;}
html{background:#000;}
body{background:#1a1a2e;}
#app{width:100%;height:100%;position:relative;background:#1a1a2e;}
#framework-cta{position:fixed;bottom:calc(var(--safe-bottom,72px) - 30px);left:50%;transform:translateX(-50%);z-index:9999;cursor:pointer;border:none;outline:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
#framework-cta.framework-cta-styled{background:#e94560;color:#ffffff;border-radius:12px;width:calc(100% - 24px);max-width:480px;padding:16px 24px;font-size:clamp(18px,5vw,28px);font-weight:700;text-transform:uppercase;letter-spacing:1px;}
#framework-cta.framework-cta-styled:active{background:#c73550;transform:translateX(-50%) scale(0.97);}
#framework-cta.framework-cta-image{background:none;padding:0;width:calc(100% - 24px);max-width:480px;}
#framework-cta.framework-cta-image:active{transform:translateX(-50%) scale(0.96);}
.framework-cta-bg{width:100%;height:auto;display:block;border-radius:8px;}
.framework-cta-text{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#1a1a2e;font-size:clamp(20px,7vw,44px);font-weight:900;font-family:'Arial Black',Arial,sans-serif;text-transform:uppercase;letter-spacing:2px;text-align:center;width:90%;}
#framework-logo{position:fixed;z-index:9000;pointer-events:none;}
#framework-logo img{display:block;height:auto;border:0;}
#framework-logo.logo-top-left{top:calc(var(--safe-top,48px) + 28px);left:8px;}
#framework-logo.logo-top-center{top:calc(var(--safe-top,48px) + 28px);left:50%;transform:translateX(-50%);}
#framework-logo.logo-top-right{top:calc(var(--safe-top,48px) + 28px);right:8px;}
#framework-cta.framework-cta-blocked{display:none !important;}
#framework-tutorial{position:fixed;top:0;left:0;width:100%;height:100%;z-index:10000;pointer-events:none;}
#framework-tutorial img{position:absolute;width:128px;height:auto;pointer-events:none;filter:drop-shadow(0 3px 10px rgba(0,0,0,0.5));}
.tutorial-hand-tap{animation:tutorial-tap 1.2s ease-in-out infinite;}
@keyframes tutorial-tap{0%,100%{transform:scale(1) translateY(0);opacity:1;}
50%{transform:scale(0.85) translateY(8px);opacity:0.7;}
}
.tutorial-hand-swipe-vertical{animation:tutorial-swipe-v 1.5s ease-in-out infinite;}
@keyframes tutorial-swipe-v{0%{transform:translateY(-30px);opacity:0.5;}
50%{transform:translateY(30px);opacity:1;}
100%{transform:translateY(-30px);opacity:0.5;}
}
.tutorial-hand-swipe-horizontal{animation:tutorial-swipe-h 1.5s ease-in-out infinite;}
@keyframes tutorial-swipe-h{0%{transform:translateX(-30px);opacity:0.5;}
50%{transform:translateX(30px);opacity:1;}
100%{transform:translateX(-30px);opacity:0.5;}
}
#framework-tutorial-tooltip{position:fixed;bottom:calc(var(--safe-bottom,72px) - 30px);left:50%;transform:translateX(-50%);width:calc(100% - 24px);max-width:480px;background:#ffffff;color:#000000;padding:24px;border-radius:20px;font-size:clamp(24px,8vw,48px);font-weight:900;font-family:'Arial Black',Arial,sans-serif;text-align:center;pointer-events:none;box-shadow:0 4px 16px rgba(0,0,0,0.4);}
html.is-portrait #framework-tutorial-tooltip{font-size:clamp(26px,9vw,52px);padding:25px;}
html.is-portrait .framework-cta-text{font-size:clamp(24px,8.5vw,53px);}
html.is-landscape #framework-tutorial-tooltip{line-height:1;padding:20px;}
html.is-landscape .framework-cta-text{line-height:1;}
#app{padding-bottom:60px;}
#ec-end-screen{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);display:flex;align-items:center;justify-content:center;z-index:10000;}
#ec-end-cta{background:#e94560;color:#ffffff;border:none;border-radius:16px;width:calc(100% - 48px);max-width:400px;padding:24px 32px;font-size:clamp(24px,7vw,40px);font-weight:900;text-transform:uppercase;letter-spacing:2px;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;animation:ec-pulse 1.5s ease-in-out infinite;}
#ec-end-cta:active{transform:scale(0.95);}
@keyframes ec-pulse{0%,100%{transform:scale(1);}
50%{transform:scale(1.05);}
}
.hidden{display:none !important;}:root,[data-theme="neon"]{--bg-body:#1a1a2e;--bg-top:#16213e;--bg-mid:#1a1a2e;--bg-bot:#0f0f23;--bg-radial:#1e3a5f;--bg-radial-edge:#0f0f23;--text-primary:#fff;--text-secondary:rgba(255,255,255,0.5);--text-hud:rgba(255,255,255,0.55);--accent:#7c4dff;--accent-light:#aa66ff;--accent-glow:rgba(124,77,255,0.5);--accent-soft:rgba(124,77,255,0.3);--accent-ghost:rgba(124,77,255,0.1);--accent-border:rgba(124,77,255,0.7);--accent-bg:rgba(124,77,255,0.15);--progress-track:rgba(255,255,255,0.08);--progress-from:#7c4dff;--progress-to:#e040fb;--cell-bg:rgba(255,255,255,0.20);--cell-border:rgba(255,255,255,0.50);--score-icon-from:#ffd700;--score-icon-to:#ff9500;--score-icon-glow:rgba(255,215,0,0.5);--lose-title:#ff9100;--danger-bg:rgba(255,64,129,0.08);--danger-border:rgba(255,64,129,0.25);--danger-glow:rgba(255,64,129,0.4);--tier1-bg:linear-gradient(145deg,#2979ff 0%,#448aff 50%,#2962ff 100%);--tier1-border:#64b5f6;--tier1-glow:rgba(41,121,255,0.4);--tier1-color:#448aff;--tier2-bg:linear-gradient(145deg,#00c853 0%,#00e676 50%,#00b248 100%);--tier2-border:#69f0ae;--tier2-glow:rgba(0,200,83,0.4);--tier2-color:#00e676;--tier3-bg:linear-gradient(145deg,#aa00ff 0%,#d500f9 50%,#9c00e6 100%);--tier3-border:#ea80fc;--tier3-glow:rgba(170,0,255,0.4);--tier3-color:#d500f9;--tier4-bg:linear-gradient(145deg,#ff6d00 0%,#ff9100 50%,#ff5500 100%);--tier4-border:#ffab40;--tier4-glow:rgba(255,109,0,0.5);--tier4-color:#ff9100;--tier5-bg:linear-gradient(145deg,#ff6d00 0%,#ffd700 25%,#00e5ff 50%,#e040fb 75%,#ffd700 100%);--tier5-border:#fff;--tier5-glow:rgba(255,215,0,0.5);--tier5-glow2:rgba(224,64,251,0.3);--flash-color:#fff;--item-text:#fff;}
#app{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:linear-gradient(180deg,var(--bg-top) 0%,var(--bg-mid) 50%,var(--bg-bot) 100%);overflow:hidden;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;}
.screen{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;transition:opacity 0.4s;opacity:0;pointer-events:none;z-index:1;}
.screen.active{opacity:1;pointer-events:all;z-index:10;}
#game-screen{justify-content:flex-start;}
.game-header{width:100%;display:flex;flex-direction:column;align-items:center;padding:calc(var(--safe-top,48px) + clamp(2px,2.5vh,25px)) 4vmin clamp(2px,2.5vh,28px);background:linear-gradient(180deg,var(--bg-top) 0%,var(--bg-mid) 100%);z-index:15;flex-shrink:0;}
.game-header #framework-logo{position:static !important;top:auto !important;left:auto !important;transform:none !important;margin-bottom:clamp(2px,0.5vh,5px);}
.game-header #framework-logo img{width:clamp(108px,36vw,153px) !important;}
@media (max-height:700px){.game-header{padding-top:calc(var(--safe-top,48px));padding-bottom:10px;}
.progress-trophy{width:clamp(22px,8vmin,38px);height:clamp(22px,8vmin,38px);}
.grid-wrap{padding-bottom:105px;}
}
.is-landscape .game-header #framework-logo{transform:translateY(-10px) !important;}
.is-landscape .progress-wrap{transform:translateY(-10px);}
.is-landscape .progress-trophy{width:clamp(26px,9.5vmin,46px);height:clamp(26px,9.5vmin,46px);}
.is-landscape .grid-wrap{padding-bottom:clamp(135px,23vh,205px);}
@keyframes pulse{0%,100%{transform:scale(1);box-shadow:0 4px 25px var(--accent-glow);}
50%{transform:scale(1.05);box-shadow:0 4px 40px var(--accent-glow);}
}
.progress-wrap{position:relative;width:100%;}
.progress-track{width:100%;height:clamp(10px,2vh,4vmin);display:flex;background:rgba(255,255,255,0.08);border-radius:2.5vmin;overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,0.15);position:relative;}
.progress-seg{flex:1;position:relative;overflow:hidden;}
.progress-seg + .progress-seg{border-left:1px solid rgba(255,255,255,0.12);}
.progress-seg::before{content:'';position:absolute;top:0;left:0;width:100%;height:100%;background:linear-gradient(180deg,#ffe04a 0%,#ffc107 40%,#e6a200 100%);transform:scaleX(0);transform-origin:left;transition:transform 0.5s cubic-bezier(.22,1,.36,1);}
.progress-seg::after{content:'';position:absolute;top:0;left:0;width:100%;height:45%;background:linear-gradient(180deg,rgba(255,255,255,0.4) 0%,rgba(255,255,255,0) 100%);opacity:0;transition:opacity 0.5s;z-index:1;}
.progress-seg.filled::before{transform:scaleX(1);}
.progress-seg.filled::after{opacity:1;}
.progress-trophy{position:absolute;right:-1vmin;top:50%;transform:translateY(-50%);width:clamp(28px,10vmin,48px);height:clamp(28px,10vmin,48px);object-fit:contain;filter:drop-shadow(0 2px 8px rgba(0,0,0,0.6));z-index:5;}

.grid{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(3,1fr);column-gap:2.2vmin;row-gap:clamp(2vmin,4vh,6vmin);width:100%;}
#slots{position:relative;z-index:1;}
#cards{position:absolute;top:0;left:0;width:100%;height:100%;z-index:2;pointer-events:none;}
.slot{border-radius:10px;background:var(--cell-bg);border:2px solid var(--cell-border);aspect-ratio:0.74;transform:scale(0.90,0.95);transition:border-color 0.2s,background 0.2s,transform 0.15s;}
.slot.drop-target{border-color:var(--accent-border);background:var(--accent-bg);transform:scale(1.06);}
.slot.invalid-drop{animation:cell-reject 0.35s ease;}
@keyframes cell-reject{0%,100%{transform:scale(1);}
30%{transform:scale(0.92);}
60%{transform:scale(1.03);}
}
.card-cell{position:relative;aspect-ratio:0.74;display:flex;align-items:center;justify-content:center;overflow:visible;pointer-events:none;transform:translateY(clamp(4px,1.2vh,10px));}
.item{width:82%;height:82%;border-radius:22%;position:absolute;display:flex;align-items:center;justify-content:center;font-weight:900;color:var(--item-text);cursor:grab;transition:transform 0.12s,box-shadow 0.2s;will-change:transform;z-index:5;pointer-events:all;}
.item:active{cursor:grabbing;}
.item .item-level{font-size:4.5vmin;text-shadow:0 1px 4px rgba(0,0,0,0.4);pointer-events:none;}
.item.t1{background:var(--tier1-bg);border:2px solid var(--tier1-border);box-shadow:0 3px 12px var(--tier1-glow);}
.item.t2{background:var(--tier2-bg);border:2px solid var(--tier2-border);box-shadow:0 3px 14px var(--tier2-glow);}
.item.t3{background:var(--tier3-bg);border:2px solid var(--tier3-border);box-shadow:0 3px 16px var(--tier3-glow);}
.item.t4{background:var(--tier4-bg);border:2px solid var(--tier4-border);box-shadow:0 3px 18px var(--tier4-glow);}
.item.t5{background:var(--tier5-bg);background-size:300% 300%;border:2px solid var(--tier5-border);box-shadow:0 0 25px var(--tier5-glow),0 0 50px var(--tier5-glow2);animation:rainbow 2.5s linear infinite;}
@keyframes rainbow{0%{background-position:0% 50%;}
100%{background-position:300% 50%;}
}
.item.has-img{width:140%;height:140%;background:none !important;border:none !important;box-shadow:none !important;border-radius:0;overflow:visible;animation:none !important;}
.item.has-img img{width:100%;height:100%;object-fit:contain;pointer-events:none;}
.item.dragging{z-index:500;transform:scale(1.15);box-shadow:0 8px 30px rgba(0,0,0,0.5);opacity:0.92;cursor:grabbing;transition:none;pointer-events:none;}
.item.ghost{opacity:0.25;pointer-events:none;}
.item.merge-source{animation:shrink-away 0.3s ease-in forwards;}
.item.merge-result{animation:pop-in 0.45s cubic-bezier(.34,1.56,.64,1) forwards;}
@keyframes shrink-away{0%{transform:scale(1);opacity:1;}
100%{transform:scale(0);opacity:0;}
}
@keyframes pop-in{0%{transform:scale(0);opacity:0;}
60%{transform:scale(1.25);opacity:1;}
100%{transform:scale(1);opacity:1;}
}
.item.spawning{animation:spawn-in 0.35s cubic-bezier(.34,1.56,.64,1) forwards;}
@keyframes spawn-in{0%{transform:scale(0) rotate(-30deg);opacity:0;}
100%{transform:scale(1) rotate(0deg);opacity:1;}
}
.float-text{position:absolute;font-size:4.5vmin;font-weight:900;pointer-events:none;z-index:200;text-shadow:0 0 12px currentColor;animation:float-up 0.9s ease-out forwards;}
@keyframes float-up{0%{transform:translateY(0) scale(1);opacity:1;}
100%{transform:translateY(-10vmin) scale(1.4);opacity:0;}
}
.particle{position:absolute;border-radius:50%;pointer-events:none;z-index:150;}
#flash{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:300;opacity:0;background:var(--flash-color);}
.shake-1{animation:sk1 0.2s ease;}
.shake-2{animation:sk2 0.3s ease;}
.shake-3{animation:sk3 0.4s ease;}
@keyframes sk1{0%,100%{transform:translate(-50%,-50%)}
25%{transform:translate(calc(-50% + 2px),calc(-50% - 1px))}
75%{transform:translate(calc(-50% - 2px),calc(-50% + 1px))}
}
@keyframes sk2{0%,100%{transform:translate(-50%,-50%)}
20%{transform:translate(calc(-50% + 3px),calc(-50% - 3px))}
40%{transform:translate(calc(-50% - 3px),calc(-50% + 2px))}
60%{transform:translate(calc(-50% + 2px),calc(-50% - 2px))}
80%{transform:translate(calc(-50% - 1px),calc(-50% + 1px))}
}
@keyframes sk3{0%,100%{transform:translate(-50%,-50%)}
15%{transform:translate(calc(-50% + 5px),calc(-50% - 4px))}
30%{transform:translate(calc(-50% - 4px),calc(-50% + 5px))}
45%{transform:translate(calc(-50% + 4px),calc(-50% - 3px))}
60%{transform:translate(calc(-50% - 3px),calc(-50% + 3px))}
75%{transform:translate(calc(-50% + 2px),calc(-50% - 1px))}
}
#lose-overlay{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:100;}
#lose-overlay.active{display:flex;}
.lose-title{font-size:9vmin;font-weight:900;color:var(--lose-title);text-shadow:0 0 40px currentColor;margin-bottom:6vmin;}
.lose-cta{width:70%;padding:4vmin 0;border:none;border-radius:50px;cursor:pointer;background:linear-gradient(135deg,var(--accent),var(--accent-light));color:var(--text-primary);font-size:5vmin;font-weight:900;text-transform:uppercase;letter-spacing:0.08em;box-shadow:0 4px 25px var(--accent-glow);animation:pulse 1.6s ease-in-out infinite;}
.item.hint-pulse{animation:hint-glow 0.8s ease-in-out infinite alternate;}
@keyframes hint-glow{0%{filter:brightness(1);transform:scale(1);}
100%{filter:brightness(1.4);transform:scale(1.08);box-shadow:0 0 20px currentColor;}
}
.grid.warning{animation:board-warn 0.6s ease;}
@keyframes board-warn{0%,100%{box-shadow:none;}
50%{box-shadow:inset 0 0 30px var(--danger-glow);}
}
.slot.danger{background:var(--danger-bg);border-color:var(--danger-border);}
</style>

function $(id) { return document.getElementById(id); }
function hijackLogo() {
var logo = document.getElementById('framework-logo');
var header = document.querySelector('.game-header');
if (logo && header) {
header.prepend(logo);
logo.style.position = '';
logo.style.top = '';
logo.style.left = '';
logo.style.transform = '';
} else {
setTimeout(hijackLogo, 50);
}
}
function shuffle(arr) {
for (var i = arr.length - 1; i > 0; i--) {
var j = Math.floor(Math.random() * (i + 1));
var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
}
}
function preloadTileImages(callback) {
var remaining = MAX_TIER;
var ratioSet = false;
for (var t = 1; t <= MAX_TIER; t++) {
(function (tier) {
var src = TILE_PATHS[tier];
if (!src) { remaining--; if (remaining <= 0) callback(); return; }
var img = new Image();
img.onload = function () {
TILE_IMAGES[tier] = img;
if (!ratioSet) {
TILE_RATIO = img.naturalWidth / img.naturalHeight;
ratioSet = true;
}
remaining--;
if (remaining <= 0) callback();
};
img.onerror = function () {
remaining--;
if (remaining <= 0) callback();
};
img.src = src;
})(t);
}
}
